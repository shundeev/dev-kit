name: Selftest

# No path filter: `selftest` is the required check of the main ruleset, so it must always report.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read          # the design approval gate reads the PR's issue (#26)
  pull-requests: read

jobs:
  selftest:
    name: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: 1.13.229
          clj-kondo: 2026.10.26
          zprint: 1.3.0

      - name: Lint
        run: |
          shellcheck -S warning claude/hooks/*.sh claude/skills/gh-project-workflow/scripts/*.sh clojure/zprint_check.sh githooks/pre-commit test/selftest.sh test/fake-gh/gh managed/pretooluse.sh
          clj-kondo --fail-level error --lint bin/kit

      - name: Selftest
        run: test/selftest.sh

      - name: Design approval and size gate (ADR-0002, #26)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bb bin/kit gate --branch "${{ github.head_ref }}" --pr "${{ github.event.pull_request.number }}"
