# Managed by dev-kit (.shared/bin/kit init). Do not edit: it is checked against dev-kit's copy (ADR-0007).
#
# `kit finish` opens a pull request as a draft, so GitHub asks the owners for a review only when this
# workflow marks it ready: after CI completed and every required check on the head commit passed.
# Then it turns auto-merge on, so the owner's Approve merges at once. A draft that carries the label
# `hold` is left alone (`kit finish --hold`, `kit release`), and so is one whose checks did not pass.
#
# It runs from the default branch only, with the workflow's own token: nothing here checks out or runs a
# pull request's code. The name below is the project's CI workflow (managed/ci.yml).
name: Ready when green

on:
  workflow_run:
    workflows: ["Selftest"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write      # auto-merge is turned on through the contents permission
  checks: read         # gh pr checks --required reads the head's check runs and statuses
  statuses: read

jobs:
  ready:
    name: ready
    runs-on: ubuntu-latest
    steps:
      - name: Mark draft pull requests ready when their required checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_PRS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          echo "CI run id: $RUN_ID, $CONCLUSION on $HEAD_BRANCH at $HEAD_SHA"
          if [ "$CONCLUSION" != "success" ]; then
            echo "decision: CI did not succeed, so no pull request is touched"
            exit 0
          fi
          prs="$(jq -r '.[]?' <<<"$EVENT_PRS")"
          if [ -n "$prs" ]; then
            echo "pull requests from the run: $(echo $prs)"
          elif [ "$HEAD_REPO" = "$GH_REPO" ]; then
            prs="$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[].number')"
            echo "the run names no pull request: found $(echo $prs) by head branch $HEAD_BRANCH"
          else
            echo "decision: the run names no pull request and comes from another repository ($HEAD_REPO), so none is touched"
            exit 0
          fi
          [ -n "$prs" ] || echo "decision: no open pull request for this run"
          for pr in $prs; do
            read -r state draft head hold < <(gh pr view "$pr" --json state,isDraft,headRefOid,labels \
              --jq '[.state, .isDraft, .headRefOid, (.labels | map(.name) | index("hold") != null)] | @tsv')
            echo "#$pr: $state, draft=$draft, hold=$hold, head $head"
            if [ "$state" != "OPEN" ]; then echo "decision: #$pr is not open, skipped"; continue; fi
            if [ "$draft" != "true" ]; then echo "decision: #$pr is not a draft, skipped"; continue; fi
            if [ "$hold" = "true" ]; then echo "decision: #$pr carries the label hold, left a draft"; continue; fi
            if [ "$head" != "$HEAD_SHA" ]; then echo "decision: #$pr has a newer commit than this run ($head), skipped: its own run decides"; continue; fi
            checks="$(gh pr checks "$pr" --required 2>&1)" && rc=0 || rc=$?
            echo "$checks"
            if [ "$rc" != 0 ]; then
              echo "decision: gh pr checks --required exited with exit code $rc for #$pr (1: a check failed or none is required, 8: pending), left a draft"
              continue
            fi
            echo "decision: every required check of #$pr passed (exit code 0), gh pr ready"
            if ! out="$(gh pr ready "$pr" 2>&1)"; then
              echo "$out"
              echo "decision: gh pr ready failed for #$pr, left a draft; going on with the next"
              continue
            fi
            if out="$(gh pr merge "$pr" --auto --squash 2>&1)"; then
              echo "decision: auto-merge is on for #$pr"
            else
              echo "$out"
              echo "decision: auto-merge could not be turned on for #$pr; the repository does not allow it, or the owner merges with kit merge"
            fi
          done
