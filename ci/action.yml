name: dev-kit checks
description: >
  Checks shared by every project that mounts dev-kit at .shared. The project's
  .github/workflows/ci.yml checks out with submodules and calls this action
  (uses: ./.shared/ci), so the checks run at the dev-kit version the project pins.

runs:
  using: composite
  steps:
    - name: Install babashka
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        bb: 1.13.229

    - name: dev-kit doctor
      id: kit
      shell: bash
      run: |
        bb "${{ github.action_path }}/../bin/kit" doctor --ci
        bb "${{ github.action_path }}/../bin/kit" modules >> "$GITHUB_OUTPUT"

    - name: Pull request gate (ADR-0002, dev-kit#26, #21)
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # The branch comes from GITHUB_HEAD_REF, not ${{ github.head_ref }} in the script: a branch name is
      # the author's text and may hold $(…) (script injection). The PR number is a number.
      run: bb "${{ github.action_path }}/../bin/kit" gate --pr "${{ github.event.pull_request.number }}"

    - name: Install clj-kondo and zprint
      if: steps.kit.outputs.clojure == 'true'
      uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
      with:
        clj-kondo: 2026.10.26
        zprint: 1.3.0

    - name: Lint (clj-kondo)
      if: steps.kit.outputs.clojure == 'true'
      shell: bash
      run: |
        mapfile -t files < <(git ls-files -- '*.clj' '*.cljs' '*.cljc' '*.bb' 'bb.edn')
        if [ "${#files[@]}" -eq 0 ]; then echo "No Clojure files"; exit 0; fi
        clj-kondo --parallel --fail-level error --lint "${files[@]}"

    - name: Format (zprint)
      if: steps.kit.outputs.clojure == 'true'
      shell: bash
      run: '"${{ github.action_path }}/../clojure/zprint_check.sh"'

    # The user-level test (dev-kit#27, docs/user-level-tests.md): the change checked the way a person
    # meets it, by the command in kit.edn's :user-test. It runs last, so the code checks fail first.
    - name: User-level test
      id: user-test
      if: steps.kit.outputs.user_test == 'true'
      shell: bash
      run: bb "${{ github.action_path }}/../bin/kit" user-test

    # Kept when the test fails too: a failure's screenshots are the ones worth seeing. Hidden files
    # are left out by the action's default, and the path is a folder kit.edn names inside the project.
    - name: Keep the user-level test's artifacts
      if: ${{ !cancelled() && steps.user-test.outcome != 'skipped' && steps.kit.outputs.user_test_artifacts != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: user-test
        path: ${{ steps.kit.outputs.user_test_artifacts }}
        overwrite: true # a re-run of the failed job uploads again under the same name
